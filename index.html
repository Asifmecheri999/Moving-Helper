<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moving Helper</title>
<style>
  :root{
    --ink:#1c1d1a;
    --paper:#f2f1ec;
    --panel:#ffffff;
    --line:#d8d6cc;
    --green:#2f7d4f;
    --green-bg:#e4f2e8;
    --red:#b6412c;
    --red-bg:#fbe6e1;
    --amber:#c98a1c;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); -webkit-tap-highlight-color:transparent;
    padding-bottom:40px;
  }
  header{
    background:var(--ink); color:var(--paper);
    padding:16px 16px 14px;
    display:flex; align-items:center; justify-content:flex-end;
    position:sticky; top:0; z-index:10;
  }
  header h1{
    font-size:16px; margin:0; font-weight:600; letter-spacing:0.2px;
    position:absolute; left:50%; transform:translateX(-50%);
  }
  header .count{font-family:var(--mono); font-size:13px; opacity:0.75;}
  .tabs{
    display:flex; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:52px; z-index:9;
  }
  .tab{
    flex:1; text-align:center; padding:11px 4px; font-size:13.5px;
    color:#8a8a80; border-bottom:2px solid transparent; cursor:pointer;
  }
  .tab.active{color:var(--ink); border-bottom-color:var(--ink); font-weight:600;}
  main{padding:14px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  label{display:block; font-size:12.5px; color:#6b6a62; margin-bottom:6px; margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], select{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; background:var(--paper); color:var(--ink); font-family:var(--sans);
  }
  input:focus, select:focus{outline:2px solid var(--ink); outline-offset:-1px;}
  input[readonly]{background:#ecece4; color:#8a8a80;}
  .sticker-row{display:flex; gap:10px; align-items:flex-end;}
  .sticker-row > div{flex:1;}
  .sticker-num{
    font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:1px;
    padding:9px 11px;
  }
  .qty-row{display:flex; align-items:center; gap:8px;}
  .qty-row input{text-align:center;}
  .stepper{
    width:42px; height:42px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); font-size:19px; color:var(--ink); flex-shrink:0;
  }
  .photo-box{
    border:1.5px dashed var(--line); border-radius:10px; height:150px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    position:relative; background:var(--paper); color:#8a8a80; font-size:13px;
  }
  .photo-box img{width:100%; height:100%; object-fit:cover;}
  .photo-box input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .flag-row{display:flex; gap:10px;}
  .flag-btn{
    flex:1; padding:14px 8px; border-radius:9px; border:2px solid var(--line);
    background:var(--panel); font-size:14.5px; font-weight:600; color:#8a8a80;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .flag-btn .dot{width:11px; height:11px; border-radius:50%; background:#ccc;}
  .flag-btn.green.on{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .flag-btn.green.on .dot{background:var(--green);}
  .flag-btn.red.on{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 15px; border-radius:20px; border:1.5px solid var(--line);
    background:var(--panel); font-size:13.5px; color:#6b6a62; font-weight:500;
  }
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .badge{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    background:var(--amber); color:#fff; white-space:nowrap;
  }
  .badge.received{background:var(--green);}
  .flag-btn.red.on .dot{background:var(--red);}
  .save-btn{
    width:100%; padding:14px; border:none; border-radius:9px; background:var(--ink);
    color:var(--paper); font-size:15.5px; font-weight:600; margin-top:16px;
  }
  .save-btn:disabled{opacity:0.4;}
  .item{
    display:flex; gap:11px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px; margin-bottom:9px; align-items:center;
  }
  .item .thumb{
    width:54px; height:54px; border-radius:7px; object-fit:cover; background:var(--paper);
    flex-shrink:0; border:1px solid var(--line);
  }
  .item .thumb.empty{display:flex; align-items:center; justify-content:center; color:#c3c1b6; font-size:10px;}
  .item .body{flex:1; min-width:0;}
  .item .top{display:flex; align-items:center; gap:7px;}
  .item .num{font-family:var(--mono); font-weight:700; font-size:13.5px;}
  .item .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .item .name{font-size:14.5px; font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item .meta{font-size:12px; color:#8a8a80; margin-top:2px;}
  .item .edit-btn{background:none; border:none; color:#8a8a80; font-size:17px; padding:4px 8px;}
  .edit-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--green-bg); color:var(--green); border:1px solid var(--green);
    border-radius:8px; padding:9px 12px; font-size:13px; font-weight:600; margin-bottom:14px;
  }
  .edit-banner a{color:var(--green); text-decoration:underline; font-weight:600;}
  .delete-btn{
    width:100%; padding:13px; border:1px solid var(--red); border-radius:9px; background:var(--red-bg);
    color:var(--red); font-size:14.5px; font-weight:600; margin-top:10px;
  }
  .owner-row{display:flex; gap:8px;}
  .owner-row input{flex:1;}
  .star-btn{
    width:42px; height:42px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); font-size:18px; color:#8a8a80; flex-shrink:0;
  }
  .star-btn.on{color:var(--amber); border-color:var(--amber);}
  .empty-state{text-align:center; color:#8a8a80; font-size:13.5px; padding:40px 20px;}
  .filters{display:flex; gap:7px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px;}
  .filter-chip{
    flex-shrink:0; padding:7px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel); font-size:12.5px; color:#6b6a62;
  }
  .filter-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .export-btn{
    width:100%; padding:12px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); font-size:14px; font-weight:600; color:var(--ink); margin-bottom:12px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>Moving Helper</h1>
  <span class="count" id="headerCount">0 logged</span>
</header>

<div class="tabs">
  <div class="tab active" data-tab="add">Add item</div>
  <div class="tab" data-tab="list">Log</div>
  <div class="tab" data-tab="checkin">A9 Check-in</div>
</div>

<main>

  <div id="addView">
    <div class="card">
      <div class="edit-banner" id="editBanner" style="display:none;">
        <span>Editing #<span id="editBannerNum"></span></span>
        <a href="#" id="cancelEditLink">Cancel</a>
      </div>
      <label>Photo</label>
      <div class="photo-box" id="photoBox">
        <span id="photoPlaceholder">Tap to take photo</span>
        <input type="file" accept="image/*" capture="environment" id="photoInput">
      </div>

      <div class="sticker-row">
        <div>
          <label>Sticker number</label>
          <input type="text" id="stickerNum" class="sticker-num" inputmode="numeric">
        </div>
      </div>

      <label>Item name</label>
      <input type="text" id="itemName" placeholder="e.g. Bench drill, M4 bolts box">

      <label>Type</label>
      <div class="chip-group" id="itemTypeGroup">
        <button type="button" class="chip" data-value="Equipment">Equipment</button>
        <button type="button" class="chip" data-value="Tool">Tool</button>
        <button type="button" class="chip" data-value="Consumables">Consumables</button>
        <button type="button" class="chip" data-value="Accessory">Accessory</button>
      </div>

      <label>Packing condition</label>
      <div class="chip-group" id="itemPackingGroup">
        <button type="button" class="chip" data-value="In box">In box</button>
        <button type="button" class="chip" data-value="Bag">Bag</button>
        <button type="button" class="chip" data-value="Unpacked">Unpacked</button>
      </div>

      <label>Quantity</label>
      <div class="qty-row">
        <button class="stepper" id="qtyMinus">&minus;</button>
        <input type="number" id="itemQty" value="1" min="0">
        <button class="stepper" id="qtyPlus">+</button>
      </div>

      <label>Location</label>
      <select id="itemLoc"></select>

      <label>Exact location (leave blank if unknown)</label>
      <input type="text" id="itemLocDetail" placeholder="e.g. Rack 3, Cabinet B">

      <label>Location at A9</label>
      <select id="itemDestDetail">
        <option value="">Select a room / area</option>
        <option>Carbon Fiber CNC</option>
        <option>Dirty Work Room</option>
        <option>3D Printer Room</option>
        <option>Store 01</option>
        <option>Store 02</option>
        <option>Storage S1</option>
        <option>Storage S3</option>
        <option>Storage S4</option>
        <option>Storage S5</option>
        <option>Storage S6</option>
        <option>Storage S7</option>
        <option>Tools Room</option>
        <option>Storage/Drone Repairs</option>
      </select>

      <label>Team / owner</label>
      <div class="owner-row">
        <input type="text" id="itemOwner" list="ownerOptions" placeholder="Who does this belong to?">
        <button type="button" class="star-btn" id="ownerDefaultBtn" title="Set/unset as default">&starf;</button>
      </div>
      <datalist id="ownerOptions"></datalist>

      <label>Take, or not?</label>
      <div class="flag-row">
        <button class="flag-btn green" id="flagGreen"><span class="dot"></span>Take</button>
        <button class="flag-btn red" id="flagRed"><span class="dot"></span>Not required</button>
      </div>

      <button class="save-btn" id="saveBtn" disabled>Save item</button>
      <button class="delete-btn" id="deleteItemBtn" style="display:none;">Delete item</button>
    </div>
  </div>

  <div id="listView" style="display:none;">
    <div class="filters" id="filters">
      <div class="filter-chip active" data-filter="all">All</div>
      <div class="filter-chip" data-filter="green">Take</div>
      <div class="filter-chip" data-filter="red">Not required</div>
    </div>
    <button class="export-btn" id="exportBtn">Export Excel</button>
    <div id="itemList"></div>
  </div>

  <div id="checkinView" style="display:none;">
    <div class="card">
      <div id="checkinStatus" style="font-size:12px; color:#8a8a80;">No items logged yet.</div>
    </div>

    <div class="card">
      <label>Search by sticker number or name</label>
      <input type="text" id="checkinSearch" placeholder="e.g. 00007 or Bench drill">
      <div id="checkinMatches" style="margin-top:10px;"></div>
      <div id="checkinResult" style="margin-top:14px;"></div>
    </div>

    <button class="export-btn" id="exportCheckinBtn">Export receiving list (Excel)</button>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
let items = [];
let locations = ['Masdar', 'Airport Warehouse', 'Kizad'];
const A9_LOCATION = 'A9 Warehouse';
let flag = null;
let photoData = null;
let currentFilter = 'all';
let editingId = null;
let defaultOwner = localStorage.getItem('tagger-defaultowner') || '';

const $ = id => document.getElementById(id);

function setupChipGroup(groupId, defaultValue){
  const group = document.getElementById(groupId);
  let value = defaultValue;
  function render(){
    group.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.value === value));
  }
  group.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => { value = c.dataset.value; render(); });
  });
  render();
  return { get: () => value, set: v => { value = v; render(); } };
}
const typeChip = setupChipGroup('itemTypeGroup', 'Equipment');
const packingChip = setupChipGroup('itemPackingGroup', 'In box');

async function loadData(){
  try{
    const raw = localStorage.getItem('tagger-items');
    items = raw ? JSON.parse(raw) : [];
  }catch(e){ items = []; }
  try{
    const rawLoc = localStorage.getItem('tagger-locations');
    if(rawLoc) locations = JSON.parse(rawLoc);
  }catch(e){}
  refreshLocSelect();
  setNextStickerNum();
  $('itemOwner').value = defaultOwner;
  updateOwnerStar();
  updateOwnerOptions();
  renderList();
}

function updateOwnerStar(){
  const val = $('itemOwner').value.trim();
  $('ownerDefaultBtn').classList.toggle('on', !!val && val === defaultOwner);
}

function updateOwnerOptions(){
  const names = Array.from(new Set(items.map(i => i.owner).filter(Boolean))).sort();
  $('ownerOptions').innerHTML = names.map(n => `<option value="${n}"></option>`).join('');
}

$('ownerDefaultBtn').addEventListener('click', () => {
  const val = $('itemOwner').value.trim();
  if(!val) return;
  defaultOwner = (defaultOwner === val) ? '' : val;
  localStorage.setItem('tagger-defaultowner', defaultOwner);
  updateOwnerStar();
  showToast(defaultOwner ? `"${defaultOwner}" set as default` : 'Default cleared');
});

async function saveItems(){
  try{
    localStorage.setItem('tagger-items', JSON.stringify(items));
  }catch(e){
    alert('Could not save — device storage may be full. Export your CSV now to be safe.');
  }
}
async function saveLocations(){
  localStorage.setItem('tagger-locations', JSON.stringify(locations));
}
function pad(n){ return String(n).padStart(5,'0'); }

function computeNextNum(){
  let maxNum = 0;
  items.forEach(i => {
    const n = parseInt(i.sticker, 10);
    if(!isNaN(n) && n > maxNum) maxNum = n;
  });
  return maxNum + 1;
}

function setNextStickerNum(){
  $('stickerNum').value = pad(computeNextNum());
}

function refreshLocSelect(){
  const sel = $('itemLoc');
  sel.innerHTML = locations.map(l => `<option>${l}</option>`).join('');
}

function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 700;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function setPhotoBox(url){
  photoData = url;
  $('photoBox').innerHTML = url
    ? `<img src="${url}"><input type="file" accept="image/*" capture="environment" id="photoInput">`
    : `<span id="photoPlaceholder">Tap to take photo</span><input type="file" accept="image/*" capture="environment" id="photoInput">`;
  bindPhotoInput();
}

function bindPhotoInput(){
  const input = document.getElementById('photoInput');
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    resizeImage(file, dataUrl => {
      setPhotoBox(dataUrl);
      checkSaveEnabled();
    });
  };
}
bindPhotoInput();

$('qtyMinus').addEventListener('click', () => {
  const el = $('itemQty');
  el.value = Math.max(0, parseInt(el.value || 0) - 1);
});
$('qtyPlus').addEventListener('click', () => {
  const el = $('itemQty');
  el.value = parseInt(el.value || 0) + 1;
});

function setFlag(f){
  flag = f;
  $('flagGreen').classList.toggle('on', f === 'green');
  $('flagRed').classList.toggle('on', f === 'red');
  checkSaveEnabled();
}
$('flagGreen').addEventListener('click', () => setFlag('green'));
$('flagRed').addEventListener('click', () => setFlag('red'));

function checkSaveEnabled(){
  const name = $('itemName').value.trim();
  const owner = $('itemOwner').value.trim();
  $('saveBtn').disabled = !(name && owner && flag);
}
$('itemName').addEventListener('input', checkSaveEnabled);
$('itemOwner').addEventListener('input', () => { checkSaveEnabled(); updateOwnerStar(); });

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1400);
}

$('saveBtn').addEventListener('click', async () => {
  const stickerVal = $('stickerNum').value.trim();
  if(!editingId && items.some(i => i.sticker === stickerVal)){
    alert(`Sticker #${stickerVal} is already used. Pick a different number.`);
    return;
  }
  const fields = {
    name: $('itemName').value.trim(),
    type: typeChip.get(),
    packing: packingChip.get(),
    qty: parseInt($('itemQty').value || 0),
    location: $('itemLoc').value,
    locationDetail: $('itemLocDetail').value.trim(),
    destination: A9_LOCATION,
    destinationDetail: $('itemDestDetail').value,
    owner: $('itemOwner').value.trim(),
    flag: flag,
    photo: photoData
  };

  if(editingId){
    const item = items.find(i => i.id === editingId);
    if(item) Object.assign(item, fields);
    await saveItems();
    showToast(`Updated #${stickerVal}`);
    resetForm();
    document.querySelector('.tab[data-tab="list"]').click();
  } else {
    const item = { id: Date.now(), sticker: stickerVal, ...fields, ts: new Date().toISOString() };
    items.unshift(item);
    await saveItems();
    showToast(`Saved #${item.sticker} — ${item.name}`);
    resetForm();
  }
  updateOwnerOptions();
  renderList();
  updateHeaderCount();
});

$('cancelEditLink').addEventListener('click', e => { e.preventDefault(); resetForm(); });

$('deleteItemBtn').addEventListener('click', async () => {
  if(!editingId) return;
  const item = items.find(i => i.id === editingId);
  if(!confirm(`Delete #${item ? item.sticker : ''}? This can't be undone.`)) return;
  items = items.filter(i => i.id !== editingId);
  await saveItems();
  showToast('Item deleted');
  resetForm();
  renderList();
  updateHeaderCount();
  document.querySelector('.tab[data-tab="list"]').click();
});

function startEdit(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  editingId = id;
  $('stickerNum').value = item.sticker;
  $('stickerNum').readOnly = true;
  $('itemName').value = item.name;
  typeChip.set(item.type || 'Equipment');
  packingChip.set(item.packing || 'In box');
  $('itemQty').value = item.qty;
  $('itemLoc').value = item.location;
  $('itemLocDetail').value = item.locationDetail || '';
  $('itemDestDetail').value = item.destinationDetail || '';
  $('itemOwner').value = item.owner || '';
  setPhotoBox(item.photo || null);
  $('editBanner').style.display = 'flex';
  $('editBannerNum').textContent = item.sticker;
  $('saveBtn').textContent = 'Update item';
  $('deleteItemBtn').style.display = 'block';
  updateOwnerStar();
  setFlag(item.flag || null);
  document.querySelector('.tab[data-tab="add"]').click();
}

function resetForm(){
  editingId = null;
  $('itemName').value = '';
  $('itemQty').value = 1;
  typeChip.set('Equipment');
  packingChip.set('In box');
  $('itemLocDetail').value = '';
  $('itemDestDetail').value = '';
  $('itemOwner').value = defaultOwner;
  setPhotoBox(null);
  setFlag(null);
  $('flagGreen').classList.remove('on');
  $('flagRed').classList.remove('on');
  setNextStickerNum();
  $('stickerNum').readOnly = false;
  $('editBanner').style.display = 'none';
  $('saveBtn').textContent = 'Save item';
  $('deleteItemBtn').style.display = 'none';
  updateOwnerStar();
  checkSaveEnabled();
}

function updateHeaderCount(){
  $('headerCount').textContent = `${items.length} logged`;
}

function renderList(){
  updateHeaderCount();
  const list = $('itemList');
  const filtered = currentFilter === 'all' ? items : items.filter(i => i.flag === currentFilter);
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state">No items yet.</div>`;
    return;
  }
  list.innerHTML = filtered.map(i => `
    <div class="item">
      ${i.photo ? `<img class="thumb" src="${i.photo}">` : `<div class="thumb empty">no photo</div>`}
      <div class="body">
        <div class="top">
          <span class="num">#${i.sticker}</span>
          <span class="dot" style="background:${i.flag==='green' ? 'var(--green)' : 'var(--red)'}"></span>
        </div>
        <div class="name">${i.name}</div>
        <div class="meta">${i.type}${i.packing ? ' · ' + i.packing : ''} · qty ${i.qty} · ${i.location}${i.locationDetail ? ' (' + i.locationDetail + ')' : ''} → ${i.destination}${i.destinationDetail ? ' (' + i.destinationDetail + ')' : ''}${i.owner ? ' · ' + i.owner : ''}</div>
      </div>
      <button class="edit-btn" data-id="${i.id}">&#9998;</button>
    </div>
  `).join('');
  list.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => startEdit(parseInt(btn.dataset.id)));
  });
}

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderList();
  });
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    $('addView').style.display = 'none';
    $('listView').style.display = 'none';
    $('checkinView').style.display = 'none';
    if(tab.dataset.tab === 'add'){
      $('addView').style.display = 'block';
    } else if(tab.dataset.tab === 'list'){
      $('listView').style.display = 'block';
      renderList();
    } else {
      $('checkinView').style.display = 'block';
      renderCheckinStatus();
    }
  });
});

function escHtml(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadStyledExcel(filename, headers, rows, textCols = []){
  const thStyle = 'background:#1c1d1a;color:#f2f1ec;font-weight:bold;padding:6px 10px;border:1px solid #999;text-align:left;font-family:sans-serif;';
  const tdStyle = 'padding:6px 10px;border:1px solid #ccc;font-family:sans-serif;';
  let table = '<table><thead><tr>' + headers.map(h => `<th style="${thStyle}">${escHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r => {
    table += '<tr>' + r.map((cell, ci) => {
      const style = textCols.includes(ci) ? tdStyle + "mso-number-format:'\\@';" : tdStyle;
      return `<td style="${style}">${escHtml(cell)}</td>`;
    }).join('') + '</tr>';
  });
  table += '</tbody></table>';
  const html = `<html><head><meta charset="UTF-8"></head><body>${table}</body></html>`;
  const blob = new Blob([html], {type: 'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

$('exportBtn').addEventListener('click', () => {
  const headers = ['Sticker','Name','Type','Packing','Qty','Location','Exact Location','Location at A9','Owner','Take?','Timestamp','Arrived'];
  const rows = items.map(i => [
    i.sticker, i.name, i.type, i.packing || '', i.qty, i.location, i.locationDetail || '',
    i.destinationDetail || '', i.owner || '', i.flag === 'green' ? 'Take' : 'Not required', i.ts,
    i.arrived ? 'Yes' : 'No'
  ]);
  downloadStyledExcel('item-tags.xls', headers, rows, [0]);
});

$('exportCheckinBtn').addEventListener('click', () => {
  const headers = ['Sticker','Name','Expected Qty','Received Qty','Status','Condition','Checked At'];
  const rows = items.map(i => [
    i.sticker, i.name, i.qty,
    i.arrived ? (i.receivedQty ?? '') : '',
    i.arrived ? 'Received' : 'Pending to receive',
    i.arrived ? (i.condition || '') : '',
    i.arrived ? (i.checkedAt || '') : ''
  ]);
  downloadStyledExcel('receiving-list.xls', headers, rows, [0]);
});

function renderCheckinStatus(){
  const el = $('checkinStatus');
  if(items.length === 0){
    el.textContent = 'No items logged yet.';
    return;
  }
  const arrivedCount = items.filter(i => i.arrived).length;
  const damagedCount = items.filter(i => i.arrived && i.condition === 'damaged').length;
  const mismatchCount = items.filter(i => i.arrived && i.receivedQty !== undefined && String(i.receivedQty) !== String(i.qty)).length;
  let txt = `${items.length} items logged · ${arrivedCount} received`;
  if(damagedCount) txt += ` · ${damagedCount} damaged`;
  if(mismatchCount) txt += ` · ${mismatchCount} qty mismatch`;
  el.textContent = txt + '.';
}

let checkinSelectedSticker = null;

function renderCheckinMatches(query){
  const matchesEl = $('checkinMatches');
  const q = query.trim().toLowerCase();
  if(!q){
    matchesEl.innerHTML = '';
    $('checkinResult').innerHTML = '';
    checkinSelectedSticker = null;
    return;
  }
  const matches = items.filter(i => i.sticker.includes(q) || i.name.toLowerCase().includes(q));
  if(matches.length === 0){
    matchesEl.innerHTML = `<div class="empty-state">No item found matching "${escHtml(query)}".</div>`;
    $('checkinResult').innerHTML = '';
    checkinSelectedSticker = null;
    return;
  }
  if(matches.length === 1){
    matchesEl.innerHTML = '';
    selectCheckinItem(matches[0].sticker);
    return;
  }
  matchesEl.innerHTML = matches.map(i => `
    <div class="item checkin-match" data-sticker="${escHtml(i.sticker)}" style="cursor:pointer;">
      ${i.photo ? `<img class="thumb" src="${i.photo}">` : `<div class="thumb empty">no photo</div>`}
      <div class="body">
        <div class="top">
          <span class="num">#${i.sticker}</span>
          <span class="badge ${i.arrived ? 'received' : ''}">${i.arrived ? 'Received' : 'Pending to receive'}</span>
        </div>
        <div class="name">${i.name}</div>
      </div>
    </div>
  `).join('');
  matchesEl.querySelectorAll('.checkin-match').forEach(el => {
    el.addEventListener('click', () => selectCheckinItem(el.dataset.sticker));
  });
  if(checkinSelectedSticker && matches.some(m => m.sticker === checkinSelectedSticker)){
    renderCheckinResult(checkinSelectedSticker);
  } else {
    $('checkinResult').innerHTML = '';
  }
}

function selectCheckinItem(sticker){
  checkinSelectedSticker = sticker;
  renderCheckinResult(sticker);
}

function renderCheckinResult(sticker){
  const box = $('checkinResult');
  if(!sticker){ box.innerHTML = ''; return; }
  const match = items.find(i => i.sticker === sticker);
  if(!match){
    box.innerHTML = `<div class="empty-state">No item found with #${sticker}.</div>`;
    return;
  }
  const expectedQty = match.qty;
  const alreadyChecked = !!match.arrived;
  const defaultReceived = (match.receivedQty !== undefined && match.receivedQty !== '') ? match.receivedQty : expectedQty;
  const defaultCondition = match.condition || 'good';

  box.innerHTML = `
    <div class="item" style="margin-bottom:0;">
      ${match.photo ? `<img class="thumb" src="${match.photo}">` : `<div class="thumb empty">no photo</div>`}
      <div class="body">
        <div class="top">
          <span class="num">#${match.sticker}</span>
          <span class="dot" style="background:${match.flag==='green' ? 'var(--green)' : 'var(--red)'}"></span>
          <span class="badge ${alreadyChecked ? 'received' : ''}">${alreadyChecked ? 'Received' : 'Pending to receive'}</span>
        </div>
        <div class="name">${match.name}</div>
        <div class="meta">${match.type} · expected qty ${expectedQty} · from ${match.location}${match.locationDetail ? ' (' + match.locationDetail + ')' : ''} → ${match.destination}${match.destinationDetail ? ' (' + match.destinationDetail + ')' : ''}</div>
      </div>
    </div>

    <label style="margin-top:14px;">Received quantity (max ${expectedQty})</label>
    <div class="qty-row">
      <button class="stepper" id="recvMinus">&minus;</button>
      <input type="number" id="recvQty" value="${defaultReceived}" min="0" max="${expectedQty}">
      <button class="stepper" id="recvPlus">+</button>
    </div>

    <label>Condition</label>
    <div class="flag-row">
      <button class="flag-btn green" id="condGood"><span class="dot"></span>Good</button>
      <button class="flag-btn red" id="condDamaged"><span class="dot"></span>Damaged</button>
    </div>

    <button class="save-btn" id="confirmReceiptBtn" style="margin-top:14px; background:${alreadyChecked ? 'var(--green)' : 'var(--ink)'};">
      ${alreadyChecked ? '✓ Receipt confirmed — tap to update' : 'Confirm receipt'}
    </button>
  `;

  let condition = defaultCondition;
  function setCond(c){
    condition = c;
    $('condGood').classList.toggle('on', c === 'good');
    $('condDamaged').classList.toggle('on', c === 'damaged');
  }
  function clampRecvQty(){
    const el = $('recvQty');
    let v = parseInt(el.value || 0);
    if(isNaN(v)) v = 0;
    v = Math.max(0, Math.min(expectedQty, v));
    el.value = v;
  }
  setCond(condition);
  $('condGood').addEventListener('click', () => setCond('good'));
  $('condDamaged').addEventListener('click', () => setCond('damaged'));
  $('recvMinus').addEventListener('click', () => { const el = $('recvQty'); el.value = Math.max(0, parseInt(el.value || 0) - 1); });
  $('recvPlus').addEventListener('click', () => { const el = $('recvQty'); el.value = Math.min(expectedQty, parseInt(el.value || 0) + 1); });
  $('recvQty').addEventListener('input', clampRecvQty);

  $('confirmReceiptBtn').addEventListener('click', async () => {
    clampRecvQty();
    match.arrived = true;
    match.receivedQty = parseInt($('recvQty').value || 0);
    match.condition = condition;
    match.checkedAt = new Date().toISOString();
    await saveItems();
    renderCheckinStatus();
    renderCheckinMatches($('checkinSearch').value);
    showToast(`#${sticker} receipt saved`);
  });
}

$('checkinSearch').addEventListener('input', e => {
  renderCheckinMatches(e.target.value);
});

loadData();
</script>
